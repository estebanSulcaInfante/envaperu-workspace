name: Workspace test baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out workspace and pinned components
        uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.WORKSPACE_REPOS_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            modulo-pesaje/backend/requirements.txt
            modulo-pesaje/backend/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare test environments
        shell: pwsh
        run: ./scripts/bootstrap-tests.ps1 -Component all

      - name: Run workspace baseline
        shell: pwsh
        run: ./scripts/test.ps1 -Component all

      - name: Verify central-weighing contract
        shell: pwsh
        run: ./scripts/test-contracts.ps1

      - name: Run isolated sync E2E
        shell: pwsh
        run: ./scripts/test-sync-e2e.ps1
